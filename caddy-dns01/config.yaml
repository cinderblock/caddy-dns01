name: Caddy DNS-01
version: "0.2.1"
slug: caddy-dns01
description: Caddy 2 reverse proxy with Cloudflare DNS-01 ACME, fronting Home Assistant.
url: https://github.com/cinderblock/caddy-dns01/tree/master/caddy-dns01
arch:
  - amd64
  - aarch64
image: ghcr.io/cinderblock/caddy-dns01
init: false
host_network: true
boot: auto
startup: services
# /addon_configs/<repo>_caddy-dns01 → /addon_config: optional global.d/ and sites.d/
# Caddyfile snippets, imported by Caddyfile.tmpl. Not the default /config, which
# the caddy base image uses for its own config autosave.
map:
  - type: addon_config
    read_only: true
    path: /addon_config
ports:
  "80/tcp": 80
  "443/tcp": 443
  "443/udp": 443
ports_description:
  "80/tcp": HTTP — ACME challenges + automatic redirect to HTTPS
  "443/tcp": HTTPS — TLS-terminating reverse proxy
  "443/udp": HTTP/3 (QUIC)
options:
  domain: ""
  email: ""
  upstream: "localhost:8123"
  cloudflare_api_token: ""
schema:
  domain: str
  email: email
  upstream: str
  cloudflare_api_token: password
